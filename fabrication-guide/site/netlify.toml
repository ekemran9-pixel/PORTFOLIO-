# Git deploy: in Netlify set Base directory = fabrication-guide/site and leave the build command empty.
# With a base directory set, Netlify skips the deploy when nothing in this folder changed.
[build]
  publish = "."

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
    X-Frame-Options = "SAMEORIGIN"

[[headers]]
  for = "/sw.js"
  [headers.values]
    Cache-Control = "no-cache"
