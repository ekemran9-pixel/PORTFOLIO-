<title>ফসফেট প্লান্ট সেফটি অফিসার গাইড</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Safety Officer Guide for phosphate fertilizer plants, in English and Bangla: hazards, chemicals, PPE, permit to work, LOTO, confined space, height, fire, emergency, health, incident investigation, KPIs, checklists and calculators.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anek+Bangla:wght@500;600;700;800&family=Hind+Siliguri:wght@400;500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap">
<style>
/* Layout concept (shared with the fabrication and drum guides): a plant safety file — sidebar is the register, each module is one
   numbered HSE sheet with a title block; safety-yellow marks what to act on; red/amber/green carry risk, never decoration. */
:root{
  --bg:#F3F4F1; --panel:#FFFFFF; --panel-2:#E9EBE6; --panel-3:#DFE2DC;
  --ink:#15191C; --ink-2:#434B51; --ink-3:#6E777D;
  --line:#D3D7D0; --line-2:#B7BDB4;
  --marker:#F2C230; --marker-ink:#15191C; --accent:#8F5300; --accent-soft:#FBEFCF;
  --steel:#245A7A; --steel-soft:#DCE9F1;
  --good:#2D6A3A; --good-soft:#DDEFE0; --warn:#8A5D00; --warn-soft:#F8EBCB; --crit:#A12F2F; --crit-soft:#F6DEDB; --high:#B4520E; --high-soft:#F9E3D1;
  --grid:rgba(21,25,28,.06);
  --display:'Anek Bangla','Hind Siliguri',system-ui,sans-serif;
  --body:'IBM Plex Sans','Hind Siliguri',system-ui,sans-serif;
  --mono:'JetBrains Mono',ui-monospace,'SFMono-Regular',monospace;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0F1214; --panel:#161A1D; --panel-2:#1D2226; --panel-3:#252B30;
  --ink:#E6EAEC; --ink-2:#A9B3B9; --ink-3:#7D888F;
  --line:#262D32; --line-2:#3A434A;
  --marker:#E9B83A; --marker-ink:#15191C; --accent:#EBB458; --accent-soft:#33280F;
  --steel:#8DBEDC; --steel-soft:#16293A;
  --good:#7CC48B; --good-soft:#15291A; --warn:#E0B354; --warn-soft:#2E2510; --crit:#E98C84; --crit-soft:#341816; --high:#F0A060; --high-soft:#3A2314;
  --grid:rgba(230,234,236,.05);
  color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0F1214; --panel:#161A1D; --panel-2:#1D2226; --panel-3:#252B30;
  --ink:#E6EAEC; --ink-2:#A9B3B9; --ink-3:#7D888F;
  --line:#262D32; --line-2:#3A434A;
  --marker:#E9B83A; --marker-ink:#15191C; --accent:#EBB458; --accent-soft:#33280F;
  --steel:#8DBEDC; --steel-soft:#16293A;
  --good:#7CC48B; --good-soft:#15291A; --warn:#E0B354; --warn-soft:#2E2510; --crit:#E98C84; --crit-soft:#341816; --high:#F0A060; --high-soft:#3A2314;
  --grid:rgba(230,234,236,.05);
  color-scheme:dark;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth;-webkit-text-size-adjust:100%}
@media (prefers-reduced-motion:reduce){html{scroll-behavior:auto}*{animation:none!important;transition:none!important}}
body{margin:0;background:var(--bg);color:var(--ink);font-family:var(--body);font-size:15.5px;line-height:1.7}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:60;background:var(--panel)}
h1,h2,h3,h4{font-family:var(--display);line-height:1.25;margin:0;text-wrap:balance;letter-spacing:-.005em}
p{margin:0}
a{color:var(--steel)}
b,strong{font-weight:600}
code,.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
code{font-size:.88em;background:var(--panel-2);padding:1px 5px;border-radius:4px;border:1px solid var(--line)}
mark{background:var(--marker);color:var(--marker-ink);padding:0 3px;border-radius:2px}
button{font:inherit}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}

/* ---------- top bar ---------- */
#bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:50;background:var(--panel);border-bottom:1px solid var(--line)}
#bar .in{display:flex;align-items:center;gap:10px;padding-block:9px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{display:flex;align-items:center;gap:10px;text-decoration:none;color:var(--ink);min-width:0}
.brand svg{flex:none}
.brand b{font-family:var(--display);font-weight:800;font-size:17px;white-space:nowrap}
.brand small{display:block;font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);line-height:1.2}
.sbox{flex:1;min-width:0;max-width:440px;margin-left:auto;position:relative}
.sbox input[type=text]{width:100%;font:inherit;font-size:14px;padding:8px 12px 8px 34px;border:1px solid var(--line-2);border-radius:7px;background:var(--bg);color:var(--ink)}
.sbox svg{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--ink-3)}
.ib{flex:none;display:grid;place-items:center;width:38px;height:38px;border-radius:7px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink-2);cursor:pointer}
.ib:hover{color:var(--ink);border-color:var(--ink-3)}
#menu{display:grid}
@media(min-width:1000px){#menu{display:none}}
#results{position:absolute;left:0;right:0;top:calc(100% + 6px);background:var(--panel);border:1px solid var(--line-2);border-radius:8px;box-shadow:0 14px 40px rgba(0,0,0,.18);max-height:min(70vh,520px);overflow:auto;z-index:70}
#results a{display:block;padding:9px 12px;border-bottom:1px solid var(--line);text-decoration:none;color:var(--ink)}
#results a:hover,#results a:focus{background:var(--panel-2)}
#results a small{display:block;font-size:12px;color:var(--accent)}
#results a span{font-size:13px;color:var(--ink-2);display:block;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#results .none{padding:14px;color:var(--ink-3);font-size:14px}
@media(max-width:560px){.brand small{display:none}.brand b{font-size:15px}}
@media(max-width:420px){.brand b{display:none}}

/* ---------- shell ---------- */
.shell{display:grid;grid-template-columns:1fr;max-width:1360px;margin:0 auto}
@media(min-width:1000px){.shell{grid-template-columns:272px minmax(0,1fr)}}
#nav{background:var(--panel);border-right:1px solid var(--line)}
@media(max-width:999px){
  #nav{position:fixed;z-index:80;inset:0 auto 0 0;width:min(320px,86vw);transform:translateX(-102%);transition:transform .22s ease;overflow:auto;
    padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-shadow:0 0 40px rgba(0,0,0,.3)}
  body.navopen #nav{transform:none}
  #veil{position:fixed;inset:0;z-index:75;background:rgba(6,9,11,.5)}
}
@media(min-width:1000px){#nav{position:sticky;top:calc(57px + env(safe-area-inset-top,0px));height:calc(100vh - 57px - env(safe-area-inset-top,0px));overflow:auto}#veil{display:none}}
#nav .reg{padding:16px 14px 30px max(14px,env(safe-area-inset-left,0px))}
.reg h6{margin:16px 6px 6px;font-family:var(--body);font-size:12px;font-weight:600;color:var(--ink-3)}
.reg h6:first-child{margin-top:0}
.reg a{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:baseline;padding:6px 8px;border-radius:6px;text-decoration:none;color:var(--ink-2);font-size:14.5px;line-height:1.35}
.reg a i{font-style:normal;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);font-variant-numeric:tabular-nums}
.reg a:hover{background:var(--panel-2);color:var(--ink)}
.reg a.on{background:var(--marker);color:var(--marker-ink);font-weight:600}
.reg a.on i{color:var(--marker-ink)}
.navfoot{margin:18px 8px 0;padding-top:14px;border-top:1px dashed var(--line-2);font-size:12.5px;color:var(--ink-3);display:grid;gap:8px}

main{min-width:0;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:22px 60px}
@media(min-width:1000px){main{padding-left:36px;padding-right:max(36px,env(safe-area-inset-right,0px))}}
.mod{max-width:1000px}
.mod[hidden]{display:none!important}

/* ---------- sheet title block ---------- */
.sheet{border:1.5px solid var(--ink);background:var(--panel);margin-bottom:26px;display:grid;grid-template-columns:1fr}
@media(min-width:760px){.sheet{grid-template-columns:1fr 250px}}
.sheet .t{padding:18px 20px 20px;display:grid;gap:8px;min-width:0}
.sheet .eb{font-family:var(--mono);font-size:12px;color:var(--accent)}
.sheet h1{font-size:clamp(26px,5.4vw,38px);font-weight:800}
.sheet .lede{color:var(--ink-2);font-size:16px;max-width:64ch}
.sheet .tb{border-top:1.5px solid var(--ink);display:grid;grid-template-columns:1fr 1fr;font-size:13px}
@media(min-width:760px){.sheet .tb{border-top:0;border-left:1.5px solid var(--ink);grid-template-columns:1fr;align-content:stretch}}
.sheet .tb div{padding:8px 12px;border-bottom:1px solid var(--line-2);display:grid;gap:1px}
.sheet .tb div:nth-child(odd){border-right:1px solid var(--line-2)}
@media(min-width:760px){.sheet .tb div:nth-child(odd){border-right:0}}
.sheet .tb div:last-child,.sheet .tb div:nth-last-child(2):nth-child(odd){border-bottom:0}
@media(min-width:760px){.sheet .tb div:nth-last-child(2):nth-child(odd){border-bottom:1px solid var(--line-2)}}
.sheet .tb small{font-size:11.5px;color:var(--ink-3)}
.sheet .tb b{font-family:var(--display);font-size:14px}

/* ---------- content blocks ---------- */
.sec{display:grid;gap:14px;margin-bottom:34px;scroll-margin-top:80px}
.sec>h2{font-size:clamp(20px,4vw,25px);font-weight:700;display:flex;gap:10px;align-items:baseline;padding-bottom:8px;border-bottom:2px solid var(--ink)}
.sec>h2 .n{font-family:var(--mono);font-size:12px;font-weight:500;color:var(--accent);flex:none}
.sec>p,.prose p{max-width:72ch;color:var(--ink-2)}
.sec h3{font-size:18px;font-weight:700}
.prose{display:grid;gap:10px}
ul.l,ol.l{margin:0;padding-left:22px;display:grid;gap:5px;color:var(--ink-2);max-width:72ch}
ul.l li::marker{color:var(--accent)}
ol.l li::marker{font-family:var(--mono);color:var(--accent);font-size:.9em}
.grid{display:grid;gap:12px;grid-template-columns:1fr}
@media(min-width:640px){.g2{grid-template-columns:repeat(2,minmax(0,1fr))}.g3{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(min-width:960px){.g3{grid-template-columns:repeat(3,minmax(0,1fr))}}
.card{background:var(--panel);border:1px solid var(--line);border-radius:8px;padding:15px 16px;display:grid;gap:8px;align-content:start;min-width:0}
.card>*{min-width:0}
.card h3,.card h4{font-size:16.5px;font-weight:700}
.card p,.card li{font-size:14.5px;color:var(--ink-2)}
.card .k{font-family:var(--mono);font-size:12px;color:var(--accent);font-weight:500}
.callout{border:1px solid var(--line-2);border-left:4px solid var(--steel);background:var(--steel-soft);border-radius:6px;padding:12px 14px;font-size:14.5px;color:var(--ink);display:grid;gap:4px;max-width:80ch}
.callout b.h{font-family:var(--display);font-size:14.5px}
.callout.tip{border-left-color:var(--good);background:var(--good-soft)}
.callout.warn{border-left-color:var(--warn);background:var(--warn-soft)}
.callout.crit{border-left-color:var(--crit);background:var(--crit-soft)}
.pill{display:inline-block;font-size:12px;padding:2px 7px;border-radius:999px;border:1px solid var(--line-2);color:var(--ink-2);background:var(--panel-2);white-space:nowrap;vertical-align:middle}
.pill.y{background:var(--marker);color:var(--marker-ink);border-color:var(--marker)}
.pill.g{color:var(--good);border-color:color-mix(in srgb,var(--good) 45%,transparent);background:var(--good-soft)}
.pill.r{color:var(--crit);border-color:color-mix(in srgb,var(--crit) 45%,transparent);background:var(--crit-soft)}
.pill.b{color:var(--steel);border-color:color-mix(in srgb,var(--steel) 45%,transparent);background:var(--steel-soft)}
.en{font-family:var(--mono);font-size:.82em;color:var(--ink-3);letter-spacing:.02em}

/* tables */
.tw{overflow-x:auto;border:1px solid var(--line);border-radius:8px;background:var(--panel);max-width:100%}
table.t{width:100%;border-collapse:collapse;font-size:13.5px;font-variant-numeric:tabular-nums}
table.t th,table.t td{padding:7px 10px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
table.t thead th{background:var(--panel-2);font-weight:600;font-size:12.5px;color:var(--ink-3);white-space:nowrap;position:sticky;top:0}
table.t tbody tr:last-child td{border-bottom:0}
table.t tbody tr:hover td{background:color-mix(in srgb,var(--marker) 9%,transparent)}
table.t td.num,table.t th.num{text-align:right;white-space:nowrap}
table.t td.num{font-family:var(--mono);font-size:12.5px}
table.t td b{color:var(--ink)}
table.t td{color:var(--ink-2)}
table.t td:first-child{color:var(--ink);font-weight:600}
table.t.dense td{padding:5px 8px}
table.t td.na{color:var(--line-2);text-align:center}
table.t tr.hi td{background:var(--accent-soft)}
.tcap{font-size:12.5px;color:var(--ink-3)}

/* figures (fittings etc.) */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{font-family:var(--body);font-size:13.5px;padding:6px 12px;border-radius:999px;border:1px solid var(--line-2);background:var(--panel);color:var(--ink-2);cursor:pointer}
.chip:hover{border-color:var(--ink-3);color:var(--ink)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.fig{background:var(--panel);border:1px solid var(--line);border-radius:8px;overflow:hidden;display:grid;align-content:start;min-width:0}
.fig .pic{background:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px),var(--panel-2);background-size:14px 14px;border-bottom:1px solid var(--line);display:grid;place-items:center;padding:10px;aspect-ratio:16/10;max-width:100%}
.fig .pic svg{width:100%;height:100%;max-height:190px}
.fig .bd{padding:12px 14px 14px;display:grid;gap:6px}
.fig h4{font-size:16px;font-weight:700;display:flex;gap:8px;flex-wrap:wrap;align-items:baseline}
.fig h4 .en{font-weight:400}
.fig p{font-size:14px;color:var(--ink-2)}
.fig .id{font-size:13.5px;color:var(--ink);background:var(--accent-soft);border-radius:5px;padding:7px 9px;border:1px dashed color-mix(in srgb,var(--accent) 40%,transparent)}
.fig .id b{color:var(--accent)}
.fig .use{font-size:13px;color:var(--ink-3)}
svg .s{fill:none;stroke:var(--ink);stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
svg .s2{fill:none;stroke:var(--ink-2);stroke-width:1.3}
svg .d{fill:none;stroke:var(--ink-3);stroke-width:1;stroke-dasharray:4 3}
svg .f{fill:var(--panel);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .fm{fill:var(--marker);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .fs{fill:var(--steel-soft);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .fl{fill:var(--panel-3);stroke:var(--ink);stroke-width:2;stroke-linejoin:round}
svg .w{fill:var(--accent);stroke:none}
svg .tx{fill:var(--ink-2);font-family:var(--mono);font-size:11px}
svg .txa{fill:var(--accent);font-family:var(--mono);font-size:11px;font-weight:600}
svg .flow{fill:none;stroke:var(--steel);stroke-width:2}
svg .flowh{fill:var(--steel);stroke:none}

/* forms / calculators */
.calc{background:var(--panel);border:1px solid var(--line);border-radius:8px;display:grid;min-width:0}
.calc>header{padding:13px 16px;border-bottom:1px solid var(--line);display:grid;gap:3px}
.calc>header h3{font-size:17px}
.calc>header p{font-size:13.5px;color:var(--ink-3)}
.calc .bd{padding:14px 16px 16px;display:grid;gap:12px}
.fields{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(140px,1fr))}
.fld{display:grid;gap:4px;min-width:0}
.fld label{font-size:12.5px;color:var(--ink-3);font-weight:500}
input[type=range]{accent-color:var(--ink);width:100%}
input[type=number],input[type=text],select{font:inherit;font-size:15px;font-variant-numeric:tabular-nums;padding:8px 10px;border:1px solid var(--line-2);border-radius:6px;background:var(--bg);color:var(--ink);width:100%;min-width:0}
.out{display:grid;gap:6px;border-top:1px dashed var(--line-2);padding-top:12px}
.res{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:8px 11px;border-radius:6px;background:var(--panel-2);flex-wrap:wrap}
.res span{font-size:13.5px;color:var(--ink-2)}
.res b{font-family:var(--mono);font-size:17px;font-weight:600;font-variant-numeric:tabular-nums;color:var(--ink)}
.res.main{background:var(--marker);}
.res.main span,.res.main b{color:var(--marker-ink)}
.hint{font-size:12.5px;color:var(--ink-3)}
.btn{font-family:var(--body);font-size:14px;font-weight:500;padding:8px 14px;border-radius:6px;border:1px solid var(--line-2);background:var(--panel-2);color:var(--ink);cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.go{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.calcnav{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:4px}

/* home */
.hero{border:1.5px solid var(--ink);background:var(--panel);margin-bottom:26px;position:relative;overflow:hidden}
.hero .iso{position:absolute;inset:0;opacity:.9;pointer-events:none;
  background:
   repeating-linear-gradient(30deg,var(--grid) 0 1px,transparent 1px 22px),
   repeating-linear-gradient(-30deg,var(--grid) 0 1px,transparent 1px 22px),
   repeating-linear-gradient(90deg,var(--grid) 0 1px,transparent 1px 38px)}
.hero .in{position:relative;padding:26px 22px 24px;display:grid;gap:18px;grid-template-columns:1fr}
@media(min-width:820px){.hero .in{grid-template-columns:1.25fr 1fr;align-items:center;padding:34px 30px}}
.hero h1{font-size:clamp(30px,6.2vw,50px);font-weight:800;line-height:1.12}
.hero h1 em{font-style:normal;text-decoration:underline;text-decoration-color:var(--marker);text-decoration-thickness:.16em;text-underline-offset:.14em;text-decoration-skip-ink:none}
.hero p{color:var(--ink-2);font-size:16.5px;max-width:56ch}
.hero .cta{display:flex;gap:8px;flex-wrap:wrap}
.hero .cta a{text-decoration:none}
.hero svg.isoart{width:100%;max-height:260px}
.tiles{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(210px,1fr))}
.tile{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;padding:13px 14px;background:var(--panel);border:1px solid var(--line);border-radius:8px;text-decoration:none;color:var(--ink);align-content:start}
.tile:hover{border-color:var(--ink);}
.tile i{font-style:normal;grid-row:span 2;font-family:var(--mono);font-size:11px;color:var(--accent);padding-top:3px}
.tile b{font-family:var(--display);font-size:16px;font-weight:700}
.tile span{font-size:13px;color:var(--ink-3);line-height:1.45}

/* checklist / roadmap */
.chk{display:grid;grid-template-columns:auto 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.chk:last-child{border-bottom:0}
.chk input{width:18px;height:18px;margin-top:4px;accent-color:var(--ink)}
.chk b{font-family:var(--display);font-size:15.5px}
.chk p{font-size:13.5px;color:var(--ink-3)}
.chk.done b{text-decoration:line-through;text-decoration-color:var(--accent);text-decoration-thickness:2px}
.prog{display:flex;gap:10px;align-items:center;flex-wrap:wrap;font-family:var(--mono);font-size:12.5px;color:var(--ink-2)}
.bar{flex:1;min-width:140px;height:8px;border-radius:4px;background:var(--panel-3);overflow:hidden}
.bar i{display:block;height:100%;background:var(--marker);border-right:2px solid var(--ink);transition:width .25s}
.stage{display:grid;grid-template-columns:44px 1fr;gap:14px;padding:16px 0;border-bottom:1px solid var(--line)}
.stage:last-child{border-bottom:0}
.stage .no{width:44px;height:44px;border:1.5px solid var(--ink);display:grid;place-items:center;font-family:var(--mono);font-weight:600;font-size:13px;background:var(--panel)}
.stage.me .no{background:var(--marker);color:var(--marker-ink)}
.stage h3{font-size:17px}
.stage .yr{font-size:12.5px;color:var(--accent);font-weight:600}

/* steps (process flow) */
